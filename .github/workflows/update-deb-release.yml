# Incremental in-place update of an existing SoryOS Debian GitHub Release.
# Rebuilds only the listed components, merges them into index.json, re-signs,
# and replaces only the changed Release assets.

name: Update SoryOS Debian Release

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Changed components to rebuild (space-separated, or "all")'
        required: true
      release_tag:
        description: 'Existing immutable Release tag to update in place'
        required: true

concurrency:
  group: update-deb-release-soryos
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  GITHUB_TOKEN: ${{ github.token }}
  SORYOS_APT_REPO: sory-os-org/sory-os-apt
  SORYOS_COSMIC_EPOCH_REPO: https://github.com/sory-os-org/cosmic-epoch.git
  SORYOS_COSMIC_EPOCH_REF: main
  SORYOS_LIBCOSMIC_REPO: https://github.com/sory-os-org/libcosmic.git
  SORYOS_LIBCOSMIC_REF: main
  SORYOS_COSMIC_WORK: /tmp/soryos-sources

jobs:
  prepare:
    name: Parse component list
    runs-on: ubuntu-latest
    outputs:
      components_json: ${{ steps.parse.outputs.components_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Resolve components
        id: parse
        run: |
          python3 - <<'PY'
          import json
          import os

          manifest = json.load(open("soryos-apt/cosmic-apps/manifest.json"))
          all_components = sorted(
              {c["name"] for c in manifest["components"] if c.get("has_debian")}
              | {"cosmic-sound-theme"}
          )
          requested = os.environ["INPUT_COMPONENTS"].strip()
          if requested == "all":
              selected = all_components
          else:
              selected = requested.split()
              unknown = sorted(set(selected) - set(all_components))
              if unknown:
                  raise SystemExit(f"Unknown component(s): {', '.join(unknown)}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"components_json={json.dumps(selected)}\n")
          PY
        env:
          INPUT_COMPONENTS: ${{ inputs.components }}

  build:
    name: ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.prepare.outputs.components_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Prepare cosmic sources (GitLab recipes)
        run: soryos-apt/scripts/prepare-cosmic-sources.sh "$SORYOS_COSMIC_WORK"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper dpkg-dev \
            rustup pkg-config cmake \
            libwayland-dev libxkbcommon-dev libglib2.0-dev \
            libclang-dev libpipewire-0.3-dev libudev-dev \
            libinput-dev libgbm-dev libseat-dev libsystemd-dev \
            libdbus-1-dev libpam0g-dev libssl-dev libzstd-dev \
            libpixman-1-dev libfontconfig-dev libfreetype-dev \
            libegl1-mesa-dev libxcb1-dev libdisplay-info-dev \
            libdav1d-dev libexpat1-dev \
            libflatpak-dev libpolkit-agent-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            mold nasm \
            imagemagick fonts-open-sans meson patchelf b3sum jq
          rustup default stable
          rustup toolchain install 1.93 --profile minimal
          cargo install just --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build component
        id: build
        env:
          SOURCE_GIT_HASH: ""
          SOURCE_DATE_EPOCH: ""
        run: |
          set -e
          cd "$SORYOS_COSMIC_WORK/cosmic-epoch"
          if [ "${{ matrix.component }}" = "cosmic-sound-theme" ]; then
            cd cosmic-sound-theme
            VERSION=$(grep "version:" meson.build | head -1 | sed "s/.*version: '*//;s/'*,//;s/[' ]//g")
            PKGDIR="/tmp/pkg/cosmic-sound-theme"
            rm -rf "$PKGDIR"
            mkdir -p "$PKGDIR/DEBIAN"
            printf '%s\n' \
              'Package: cosmic-sound-theme' \
              "Version: ${VERSION}" \
              'Section: sound' \
              'Priority: optional' \
              'Architecture: all' \
              'Maintainer: SoryOS Maintainers <maintainers@soryos.local>' \
              'Description: COSMIC Sound Theme' \
              > "$PKGDIR/DEBIAN/control"
            meson setup build --prefix=/usr
            DESTDIR="$PKGDIR" meson install -C build
            dpkg-deb --build "$PKGDIR" "../cosmic-sound-theme_${VERSION}_all.deb"
            echo "no_deb=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "${{ matrix.component }}"
          if [ ! -f debian/control ]; then
            echo "no_deb=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$GITHUB_WORKSPACE/soryos-apt/scripts/ensure-cargo-lock.sh" "$PWD"
          dpkg-buildpackage -us -uc -b -d
          echo "no_deb=false" >> "$GITHUB_OUTPUT"

      - name: Upload rebuilt .deb
        if: steps.build.outputs.no_deb != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.component }}
          path: ${{ env.SORYOS_COSMIC_WORK }}/cosmic-epoch/*.deb
          retention-days: 2

  publish:
    name: Merge index and replace changed assets
    needs: [prepare, build]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum jq openssl curl

      - name: Download rebuilt packages
        id: artifacts
        uses: actions/download-artifact@v4
        with:
          path: soryos-apt/new-packages
          pattern: "deb-*"
          merge-multiple: true

      - name: Skip publish when no packages were built
        id: check
        run: |
          if compgen -G "soryos-apt/new-packages/*.deb" > /dev/null; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "No rebuilt .deb artifacts; skipping index merge."
          fi

      - name: Update signed Release index
        if: steps.check.outputs.has_packages == 'true'
        env:
          SORYOS_INDEX_PRIVATE_KEY_PEM: ${{ secrets.SORYOS_INDEX_PRIVATE_KEY_PEM }}
        run: |
          cd soryos-apt
          TAG="${{ inputs.release_tag }}"
          INDEX_URL="https://github.com/${{ env.SORYOS_APT_REPO }}/releases/download/${TAG}/index.json"
          curl -fsSL "$INDEX_URL" -o /tmp/current-index.json
          curl -fsSL "${INDEX_URL%.json}.json.sig" -o /tmp/current-index.json.sig
          curl -fsSL "${INDEX_URL%/index.json}/index-signing-key.pub.pem" \
            -o /tmp/index-signing-key.pub.pem
          ./scripts/verify-release-index.sh \
            /tmp/current-index.json \
            /tmp/current-index.json.sig \
            /tmp/index-signing-key.pub.pem
          python3 scripts/update-release-index.py \
            /tmp/current-index.json \
            new-packages \
            release-out/index.json \
            "$TAG"
          umask 077
          printf '%s\n' "$SORYOS_INDEX_PRIVATE_KEY_PEM" > index-signing-key.pem
          ./scripts/sign-release-index.sh release-out/index.json index-signing-key.pem
          openssl pkey -in index-signing-key.pem -pubout \
            -out release-out/index-signing-key.pub.pem
          openssl pkey -pubin -in release-out/index-signing-key.pub.pem \
            -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n' \
            > release-out/index-signing-key.pub.hex
          rm -f index-signing-key.pem

      - name: Replace changed Release assets
        if: steps.check.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd soryos-apt
          TAG="${{ inputs.release_tag }}"
          for asset in release-out/*; do
            [[ -f "$asset" ]] || continue
            gh release upload "$TAG" "$asset" --repo "${{ env.SORYOS_APT_REPO }}" --clobber
          done
          for deb in new-packages/*.deb; do
            [[ -f "$deb" ]] || continue
            gh release upload "$TAG" "$deb" --repo "${{ env.SORYOS_APT_REPO }}" --clobber
          done

      - name: Trigger Pages catalog publish
        if: steps.check.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-pages.yml \
            --repo "${{ env.SORYOS_APT_REPO }}" \
            -f release_tag="${{ inputs.release_tag }}"
