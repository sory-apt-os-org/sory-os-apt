name: Build & Publish SoryOS APT

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional immutable GitHub Release tag for publishing .deb assets'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  SORYOS_APT_REPO: sory-os-org/sory-os-apt
  SORYOS_COSMIC_EPOCH_REPO: https://github.com/sory-os-org/cosmic-epch.git
  SORYOS_COSMIC_EPOCH_REF: main
  SORYOS_LIBCOSMIC_REPO: https://github.com/sory-os-org/libcosmic.git
  SORYOS_LIBCOSMIC_REF: main
  SORYOS_COSMIC_WORK: ${{ runner.temp }}/soryos-sources

jobs:
  build-integration:
    name: Integration packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Prepare cosmic sources (GitLab recipes)
        run: soryos-apt/scripts/prepare-cosmic-sources.sh "$SORYOS_COSMIC_WORK"

      - name: Build integration packages
        env:
          SORYOS_COSMIC_EPOCH_DIR: ${{ env.SORYOS_COSMIC_WORK }}/cosmic-epoch
        run: |
          cd soryos-apt
          mkdir -p pool/stable
          ./scripts/build-packages.sh

      - name: Upload integration debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-integration
          path: soryos-apt/pool/stable/*.deb
          retention-days: 1

  build-cosmic:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - cosmic-applets
          - cosmic-applibrary
          - cosmic-bg
          - cosmic-comp
          - cosmic-edit
          - cosmic-files
          - cosmic-greeter
          - cosmic-icons
          - cosmic-idle
          - cosmic-initial-setup
          - cosmic-launcher
          - cosmic-monitor
          - cosmic-notifications
          - cosmic-osd
          - cosmic-panel
          - cosmic-player
          - cosmic-randr
          - cosmic-screenshot
          - cosmic-session
          - cosmic-settings
          - cosmic-settings-daemon
          - cosmic-sory-ia
          - cosmic-store
          - cosmic-term
          - cosmic-wallpapers
          - cosmic-workspaces-epoch
          - soryos-launcher
          - simple-wrapper
          - xdg-desktop-portal-cosmic
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Prepare cosmic sources (GitLab recipes)
        run: soryos-apt/scripts/prepare-cosmic-sources.sh "$SORYOS_COSMIC_WORK"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cosmic
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential devscripts debhelper dpkg-dev \
            gnupg gzip xz-utils apt-utils \
            cargo rustup pkg-config cmake just \
            libwayland-dev libxkbcommon-dev libglib2.0-dev \
            libclang-dev libpipewire-0.3-dev libudev-dev \
            libinput-dev libgbm-dev libseat-dev libsystemd-dev \
            libdbus-1-dev libpam0g-dev libssl-dev libzstd-dev \
            libpixman-1-dev libfontconfig-dev libfreetype-dev \
            libegl1-mesa-dev libxcb1-dev libdisplay-info-dev \
            libdav1d-dev libexpat1-dev \
            libflatpak-dev libpolkit-agent-1-dev \
            imagemagick fonts-open-sans \
            meson patchelf

      - name: Build with dpkg-buildpackage
        id: build
        run: |
          set -e
          cd "$SORYOS_COSMIC_WORK/cosmic-epoch/${{ matrix.component }}"

          if [ ! -f debian/control ]; then
            echo "No debian/control - skipping dpkg-buildpackage"
            echo "no_deb=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          SOURCE=$(grep '^Source:' debian/control | sed 's/Source: //')
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "Building $SOURCE..."

          dpkg-buildpackage -us -uc -b 2>&1 | tail -20

          echo "no_deb=false" >> $GITHUB_OUTPUT

      - name: Collect .deb
        if: steps.build.outputs.no_deb != 'true'
        run: |
          cd "$SORYOS_COSMIC_WORK/cosmic-epoch"
          SOURCE="${{ steps.build.outputs.source }}"
          echo "Looking for debs matching source=$SOURCE"
          ls -la ${SOURCE}_*.deb 2>/dev/null || true
          for deb in ${SOURCE}_*.deb; do
            if [ -f "$deb" ]; then
              echo "Found: $deb"
              echo "pkg_deb=$deb" >> $GITHUB_OUTPUT
            fi
          done

      - name: Upload .deb artifact
        if: steps.build.outputs.no_deb != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.component }}
          path: ${{ env.SORYOS_COSMIC_WORK }}/cosmic-epoch/${{ steps.build.outputs.source }}_*.deb
          retention-days: 1

  build-sound-theme:
    name: cosmic-sound-theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Prepare cosmic sources (GitLab recipes)
        run: soryos-apt/scripts/prepare-cosmic-sources.sh "$SORYOS_COSMIC_WORK"

      - name: Build cosmic-sound-theme with meson
        run: |
          cd "$SORYOS_COSMIC_WORK/cosmic-epoch/cosmic-sound-theme"
          VERSION=$(grep "version:" meson.build | head -1 | sed "s/.*version: '*//;s/'*,//;s/[' ]//g")
          PKGDIR="/tmp/pkg/cosmic-sound-theme"
          rm -rf "$PKGDIR"
          mkdir -p "$PKGDIR/DEBIAN"

          cat > "$PKGDIR/DEBIAN/control" <<CTRL
Package: cosmic-sound-theme
Version: $VERSION
Section: sound
Priority: optional
Architecture: all
Maintainer: SoryOS Maintainers <maintainers@soryos.local>
Description: COSMIC Sound Theme
 Sound theme for the COSMIC desktop environment.
CTRL

          meson setup build --prefix=/usr --destdir="$PKGDIR"
          meson install -C build
          dpkg-deb --build "$PKGDIR" "../${PKG_NAME}_${VERSION}_all.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-cosmic-sound-theme
          path: ${{ env.SORYOS_COSMIC_WORK }}/cosmic-epoch/cosmic-sound-theme_*.deb
          retention-days: 1

  publish:
    name: Publish to GitHub Release
    needs:
      - build-integration
      - build-cosmic
      - build-sound-theme
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: soryos-apt

      - name: Install publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg gzip b3sum jq openssl curl

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: soryos-apt/release-out
          pattern: "deb-*"
          merge-multiple: true

      - name: Download integration debs
        uses: actions/download-artifact@v4
        with:
          path: soryos-apt/release-out
          pattern: "debs-integration"
          merge-multiple: true

      - name: Build signed Release index
        env:
          SORYOS_GPG_PRIVATE_KEY: ${{ secrets.SORYOS_GPG_PRIVATE_KEY }}
          SORYOS_INDEX_PRIVATE_KEY_PEM: ${{ secrets.SORYOS_INDEX_PRIVATE_KEY_PEM }}
        run: |
          cd soryos-apt
          mkdir -p pool/stable dists/stable/main/binary-amd64 keyrings release-out
          mv release-out/*.deb pool/stable/ 2>/dev/null || true
          ./scripts/ci-import-signing-key.sh
          SORYOS_SUITES=stable ./scripts/generate-index.sh
          ./scripts/sign-repository.sh
          cp keyrings/soryos-archive-keyring.gpg release-out/
          cp dists/stable/Release release-out/
          cp dists/stable/Release.gpg release-out/
          cp dists/stable/InRelease release-out/
          cp dists/stable/main/binary-amd64/Packages release-out/
          cp dists/stable/main/binary-amd64/Packages.gz release-out/
          cp pool/stable/*.deb release-out/
          python3 scripts/generate-release-index.py \
            release-out \
            "${{ inputs.release_tag }}" \
            "${{ env.SORYOS_APT_REPO }}" \
            release-out/index.json \
            "https://github.com/${{ env.SORYOS_APT_REPO }}/releases/download/${{ inputs.release_tag }}" \
            release-out/soryos-archive-keyring.gpg
          test -n "${SORYOS_INDEX_PRIVATE_KEY_PEM:-}" || {
            echo "Missing SORYOS_INDEX_PRIVATE_KEY_PEM GitHub secret" >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$SORYOS_INDEX_PRIVATE_KEY_PEM" > index-signing-key.pem
          ./scripts/sign-release-index.sh release-out/index.json index-signing-key.pem
          openssl pkey -in index-signing-key.pem -pubout \
            -out release-out/index-signing-key.pub.pem
          openssl pkey -pubin -in release-out/index-signing-key.pub.pem \
            -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n' \
            > release-out/index-signing-key.pub.hex
          rm -f index-signing-key.pem
          ./scripts/test-local-repo.sh

      - name: Ensure immutable Release tag is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.release_tag }}" --repo "${{ env.SORYOS_APT_REPO }}" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite immutable artifacts" >&2
            exit 1
          fi

      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd soryos-apt/release-out
          gh release create "${{ inputs.release_tag }}" \
            --repo "${{ env.SORYOS_APT_REPO }}" \
            --title "SoryOS Debian packages (${{ inputs.release_tag }})" \
            --notes "Immutable SoryOS .deb Release published by build-all.yml"
          while IFS= read -r -d '' asset; do
            gh release upload "${{ inputs.release_tag }}" "$asset" \
              --repo "${{ env.SORYOS_APT_REPO }}" || exit 1
            sleep 1
          done < <(find . -maxdepth 1 -type f -print0 | sort -z)
