# GitHub Actions Workflow for Automatic Publishing of SoryOS APT Repository # This workflow builds the COSMIC components, creates Debian packages, and publishes them to the GitHub Pages APT repository. # # The workflow is triggered on pushes to the main branch and on release events. # # Jobs: #   - build: Build the packages for multiple COSMIC components in a matrix. #   - publish: Publish the built packages to the GitHub Pages branch (gh-pages) and update the repository. # # Note: This workflow assumes the repository has two branches: #   - main: Contains the source code and the APT repository structure (but not the built packages) #   - gh-pages: Contains the published APT repository (via GitHub Pages) # # Steps: #   1. Checkout the repository #   2. Set up Rust and Cargo #   3. Install dependencies (cargo-deb, etc.) #   4. Build each component as a Debian package #   5. Publish the packages to the APT repository pool and update the metadata #   6. Sign the repository (if GPG key is available) #   7. Push the updated APT repository to the gh-pages branch # # For more information, see: #   https://docs.github.com/en/actions #   https://www.debian.org/doc/manuals/debian-reference/ch05.en.html#_the_apt_repository # # Workflow file: .github/workflows/apt-publish.yml name: Publish SoryOS APT Repository on: push: branches: [ main ] pull_request: branches: [ main ] release: types: [ published ] jobs: build: runs-on: ubuntu-latest strategy: matrix: component: [ cosmic-comp, cosmic-session, cosmic-greeter, cosmic-panel, cosmic-applets, cosmic-launcher, cosmic-notifications, cosmic-osd, cosmic-files, cosmic-edit, cosmic-term, cosmic-store, cosmic-player, cosmic-settings, cosmic-settings-daemon, cosmic-bg, cosmic-idle, cosmic-randr, cosmic-screenshot, cosmic-monitor, cosmic-applibrary, cosmic-workspaces-epoch, cosmic-icons, cosmic-wallpapers, cosmic-sound-theme, cosmic-initial-setup, xdg-desktop-portal-cosmic, soryos-launcher, simple-wrapper, cosmic-sory-ia ] steps: - name: Checkout repository uses: actions/checkout@v4 with: fetch-depth: 0 - name: Set up Rust toolchain uses: dtolnay/rust-toolchain@stable with: toolchain: stable components: clippy, rustfmt - name: Install cargo-deb run: cargo install cargo-deb - name: Set up caching for Cargo uses: actions/cache@v4 with: path: | ~/.cargo/registry ~/.cargo/git key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }} restore-keys: | cargo-${{ runner.os }}- - name: Build package for ${{ matrix.component }} run: |   # Navigate to the component directory   cd cosmic-epoch/${{ matrix.component }}   # Ensure we have a Cargo.toml (if not, skip)   if [ ! -f Cargo.toml ]; then     echo 