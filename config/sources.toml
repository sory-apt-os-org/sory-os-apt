# Source URLs for CI — same as redox/recipes/cosmic/*/recipe.toml
# CI clones these; local ISO build must NOT compile from them.

[cosmic_epoch]
git = "https://gitlab.com/sory-os.org/cosmic-epoch.git"
branch = "main"

[libcosmic]
git = "https://gitlab.com/sory-os.org/libcosmic.git"
branch = "main"

[cosmic_sory_ia]
git = "https://gitlab.com/sory-os.org/cosmic-sory-ia.git"
branch = "main"

# Publication (binaries on Release, catalog on Pages)
[apt]
repository = "sory-os-org/sory-os-apt"
pages_base_url = "https://sory-os-org.github.io/sory-os-apt"
