# SoryOS Source Repositories — Inventaire complet
# Généré depuis l'analyse des 9 dépôts locaux + submodules cosmic-epoch
# Versions : epoch-1.4.0 (sauf indication contraire)
# =========================================================================

upstream_org: sory-x
fork_org: sory-x
# NOTE: toutes les URLs ci-dessous pointent vers nos forks sory-x
# Les originaux upstream sont chez sory-x
epoch_version: "1.4.0"

repos:

  # ═════════════════════════════════════════════════════════════════════
  # COSMIC Desktop — Composants Rust (debhelper/cargo)
  # Tous dans le monorepo sory-x/soryos
  # ═════════════════════════════════════════════════════════════════════

  # ── Dépôts avec debian/control complets (build dpkg natif) ────────

  - name: cosmic-comp
    url: https://github.com/sory-x/cosmic-comp
    type: rust
    branch: master
    version: "0.1"
    description: Wayland compositor for the COSMIC desktop environment
    architecture: amd64 arm64
    depends:
      - libegl1
      - libwayland-server0
    recommends:
      - cosmic-session
      - libgl1-mesa-dri
    build_depends:
      - cargo, cmake, libegl1-mesa-dev, libfontconfig-dev, libgbm-dev
      - libinput-dev, libpixman-1-dev, libseat-dev, libsystemd-dev
      - libudev-dev, libwayland-dev, libxcb1-dev, libxkbcommon-dev
      - libdisplay-info-dev, rustc (>=1.57)
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-comp
    has_debian: true

  - name: cosmic-files
    url: https://github.com/sory-x/cosmic-files
    type: rust
    branch: master
    version: "1.4.0"
    description: COSMIC File Manager
    architecture: amd64 arm64
    depends:
      - xdg-utils
    build_depends:
      - debhelper-compat (=13), git, just (>= 1.13.0)
      - libclang-dev, libglib2.0-dev, libxkbcommon-dev, pkg-config, rust-all
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-files
    has_debian: true
    binary_packages:
      - cosmic-files
      - cosmic-files-applet

  - name: cosmic-greeter
    url: https://github.com/sory-x/cosmic-greeter
    type: rust
    branch: master
    version: "0.1.0"
    description: COSMIC Greeter (login screen)
    architecture: amd64 arm64
    pre_depends:
      - greetd
    depends:
      - adduser, cosmic-comp, cosmic-greeter-daemon, cosmic-randr, dbus
    recommends:
      - xinit
    provides: x-display-manager
    build_depends:
      - debhelper-compat (=13), git, just (>= 1.13.0)
      - libclang-dev, libinput-dev, libpam-dev, libwayland-dev
      - libxkbcommon-dev, pkg-config, rust-all
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-greeter
    has_debian: true
    binary_packages:
      - cosmic-greeter
      - cosmic-greeter-daemon

  - name: cosmic-launcher
    url: https://github.com/sory-x/cosmic-launcher
    type: rust
    branch: master
    version: "1.0.12"
    description: COSMIC Launcher (application launcher)
    architecture: amd64 arm64
    depends:
      - soryos-launcher
    build_depends:
      - debhelper (>= 11), debhelper-compat (= 11)
      - rustc (>=1.63), cargo, just, intltool
      - libxkbcommon-dev, libwayland-dev, pkg-config
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-launcher
    has_debian: true

  - name: cosmic-panel
    url: https://github.com/sory-x/cosmic-panel
    type: rust
    branch: master
    version: "0.1.0"
    description: XDG Shell Wrapper Panel for COSMIC
    architecture: amd64 arm64
    build_depends:
      - debhelper (>= 11), debhelper-compat (= 11)
      - just, cargo, libwayland-dev, libxkbcommon-dev, pkg-config, desktop-file-utils
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-panel
    has_debian: true
    binary_packages:
      - cosmic-panel
      - cosmic-panel-bin
      - cosmic-panel-config

  - name: cosmic-settings
    url: https://github.com/sory-x/cosmic-settings
    type: rust
    branch: master
    version: "1.0.12"
    description: Settings application for the COSMIC desktop environment
    architecture: amd64 arm64
    depends:
      - accountsservice, cosmic-randr, cosmic-settings-daemon
      - gettext, iso-codes, network-manager-gnome
      - network-manager-openvpn, network-manager-openvpn-gnome, xkb-data
    recommends:
      - adw-gtk3
    build_depends:
      - debhelper-compat (=13), cmake, fonts-open-sans, just, libclang-dev
      - libdav1d-dev, libexpat1-dev, libfontconfig-dev, libfreetype-dev
      - libinput-dev, libudev-dev, libwayland-dev, libxkbcommon-dev
      - pkg-config, rust-all
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-settings
    has_debian: true

  # ── Dépôts sans debian/control local (build cargo manuel ou via cosmic-epoch) ──

  - name: cosmic-epoch
    url: https://github.com/sory-x/cosmic-epoch
    type: meta
    branch: master
    version: "1.4.0"
    description: COSMIC Desktop Environment (meta-repo with submodules)
    local_path: /home/sory/Bureau/soryos/cosmic-epoch
    has_debian: false
    submodules:
      - cosmic-applets
      - cosmic-applibrary
      - cosmic-bg
      - cosmic-comp
      - cosmic-edit
      - cosmic-files
      - cosmic-greeter
      - cosmic-icons
      - cosmic-idle
      - cosmic-initial-setup
      - cosmic-launcher
      - cosmic-monitor
      - cosmic-notifications
      - cosmic-osd
      - cosmic-panel
      - cosmic-player
      - cosmic-randr
      - cosmic-screenshot
      - cosmic-session
      - cosmic-settings
      - cosmic-settings-daemon
      - cosmic-sound-theme
      - cosmic-store
      - cosmic-term
      - cosmic-wallpapers
      - cosmic-workspaces-epoch
      - soryos-launcher
      - xdg-desktop-portal-cosmic
      - simple-wrapper

  - name: iso
    url: https://github.com/sory-x/iso
    type: make
    branch: master
    version: "24.04"
    description: ISO builder for SoryOS
    local_path: /home/sory/Bureau/soryos/iso
    has_debian: false

  - name: libcosmic
    url: null
    type: rust
    branch: master
    version: "1.0.0"
    description: COSMIC GUI toolkit (Rust)
    local_path: /home/sory/Bureau/soryos/libcosmic
    has_debian: false
    binary_packages:
      - libcosmic
      - cosmic-config
      - cosmic-config-derive
      - cosmic-theme
      - cosmic-icons

  # ── Projets autonomes dans cosmic-epoch/ ──

  - name: cosmic-sory-ia
    url: null
    type: rust
    branch: master
    version: "0.0.0"
    description: SoryOS AI engine — fork OpenAI Codex + COSMIC desktop
    local_path: /home/sory/Bureau/soryos/cosmic-epoch/cosmic-sory-ia
    has_debian: false

